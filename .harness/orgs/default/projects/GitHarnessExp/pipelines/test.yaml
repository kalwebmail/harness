pipeline:
  name: test
  identifier: test
  projectIdentifier: GitHarnessExp
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.KalMiniKube
              namespace: safe-cracker-ns
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    connectorRef: account.ECS
                    image: safecrackerimg1
                    shell: Bash
                    command: cd orientation/safe-cracker && npm install
  properties:
    ci:
      codebase:
        connectorRef: account.githubkalwebmail
        build: <+input>
